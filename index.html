<section id="calculadora-deshidratacion" style="max-width:700px;margin:auto;padding:24px;border:1px solid #ddd;border-radius:16px;font-family:Arial,sans-serif;">
  <h2>Calculadora de tasa de deshidratación</h2>

  <label>Peso antes del ejercicio (kg)</label>
  <input id="pesoAntes" type="number" step="0.1" placeholder="Ej: 70.0">

  <label>Peso después del ejercicio (kg)</label>
  <input id="pesoDespues" type="number" step="0.1" placeholder="Ej: 68.8">

  <label>Líquido ingerido durante el ejercicio (L)</label>
  <input id="liquidoIngerido" type="number" step="0.1" placeholder="Ej: 1.2">

  <label>Orina durante el ejercicio (L)</label>
  <input id="orina" type="number" step="0.1" placeholder="Ej: 0.2">

  <label>Duración del ejercicio (horas)</label>
  <input id="duracion" type="number" step="0.1" placeholder="Ej: 2.5">

  <button onclick="calcularDeshidratacion()">Calcular</button>

  <div id="resultadoDeshidratacion"></div>
</section>

<style>
  #calculadora-deshidratacion input {
    width: 100%;
    padding: 10px;
    margin: 6px 0 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  #calculadora-deshidratacion button {
    width: 100%;
    padding: 12px;
    background: #111;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
  }

  #calculadora-deshidratacion button:hover {
    background: #333;
  }

  #resultadoDeshidratacion {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    background: #f5f5f5;
    line-height: 1.6;
  }
</style>

<script>
function calcularDeshidratacion() {
  const pesoAntes = parseFloat(document.getElementById("pesoAntes").value);
  const pesoDespues = parseFloat(document.getElementById("pesoDespues").value);
  const liquidoIngerido = parseFloat(document.getElementById("liquidoIngerido").value) || 0;
  const orina = parseFloat(document.getElementById("orina").value) || 0;
  const duracion = parseFloat(document.getElementById("duracion").value);

  const resultado = document.getElementById("resultadoDeshidratacion");

  if (!pesoAntes || !pesoDespues || !duracion || pesoAntes <= 0 || pesoDespues <= 0 || duracion <= 0) {
    resultado.innerHTML = "Introduce valores válidos en peso antes, peso después y duración.";
    return;
  }

  const perdidaPeso = pesoAntes - pesoDespues;
  const perdidaSudorTotal = perdidaPeso + liquidoIngerido - orina;
  const tasaSudoracion = perdidaSudorTotal / duracion;
  const porcentajeDeshidratacion = (perdidaPeso / pesoAntes) * 100;
  const liquidoParaRehidratar = perdidaPeso * 1.5;

  let interpretacion = "";

  if (porcentajeDeshidratacion < 1) {
    interpretacion = "Deshidratación baja o bien controlada.";
  } else if (porcentajeDeshidratacion < 2) {
    interpretacion = "Deshidratación ligera. Conviene mejorar la estrategia de hidratación.";
  } else if (porcentajeDeshidratacion < 3) {
    interpretacion = "Deshidratación moderada. Puede afectar al rendimiento.";
  } else {
    interpretacion = "Deshidratación elevada. Riesgo importante de caída del rendimiento y problemas asociados.";
  }

  resultado.innerHTML = `
    <strong>Resultados</strong><br>
    Pérdida de peso: <strong>${perdidaPeso.toFixed(2)} kg</strong><br>
    Pérdida total estimada de sudor: <strong>${perdidaSudorTotal.toFixed(2)} L</strong><br>
    Tasa de sudoración: <strong>${tasaSudoracion.toFixed(2)} L/h</strong><br>
    Porcentaje de deshidratación: <strong>${porcentajeDeshidratacion.toFixed(2)}%</strong><br>
    Líquido recomendado para rehidratar: <strong>${liquidoParaRehidratar.toFixed(2)} L</strong><br><br>
    <strong>Interpretación:</strong> ${interpretacion}
  `;
}
</script>
